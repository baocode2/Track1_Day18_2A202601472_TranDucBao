<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Notes — Micro-Prototype Day 18</title>
<style>
:root{
  --bg:#f2f4f7; --panel:#fff; --ink:#16181d; --muted:#6b7280; --line:#e3e6ea;
  --accent:#2f5bd7; --accent-soft:#eaf0ff; --warn:#b45309; --warn-soft:#fff7ed;
  --ok:#15803d; --ok-soft:#ecfdf3; --ai:#6d3fd4; --ai-soft:#f4f0ff;
  --radius:12px; --mono:ui-monospace,"Cascadia Code",Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.55 -apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:18px 18px 50px}
h1{font-size:19px;margin:0 0 2px}
h2{font-size:15px;margin:0 0 10px}
.sub{color:var(--muted);font-size:13px;margin:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:15px;margin-bottom:13px}
.row{display:flex;gap:13px;flex-wrap:wrap}
.col{flex:1 1 380px;min-width:0}
button{font:inherit;cursor:pointer;border-radius:999px;border:1px solid var(--line);
  background:#fff;padding:6px 14px;color:var(--ink)}
button:hover{border-color:#b9c0ca;background:#fbfbfc}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover{background:#2549b0}
button.mini{padding:4px 11px;font-size:12.5px}
button:disabled{opacity:.42;cursor:not-allowed}
.switcher{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:11px}
.switcher button{padding:8px 16px;font-weight:600}
.switcher button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.banner{background:var(--warn-soft);border:1px solid #fed7aa;color:#7c2d12;
  border-radius:var(--radius);padding:11px 13px;font-size:13px;margin-bottom:13px}

/* ---------- chat ---------- */
.chat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  display:flex;flex-direction:column;height:640px;overflow:hidden}
.chead{padding:11px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.avatar{width:32px;height:32px;border-radius:999px;display:grid;place-items:center;
  font-size:14px;font-weight:700;flex:0 0 auto}
.avatar.ai{background:var(--ai-soft);color:var(--ai)}
.avatar.app{background:var(--accent-soft);color:var(--accent)}
.chead .who{font-weight:600;font-size:14px}
.chead .st{font-size:12px;color:var(--muted)}
.thread{flex:1;overflow-y:auto;padding:15px;background:
  linear-gradient(180deg,#fafbfc 0%,#fff 60px)}
.msg{display:flex;gap:9px;margin-bottom:13px;align-items:flex-end}
.msg.me{flex-direction:row-reverse}
.bub{max-width:78%;padding:10px 13px;border-radius:15px;font-size:14.2px;line-height:1.5}
.msg.ai .bub{background:var(--ai-soft);border-bottom-left-radius:5px}
.msg.app .bub{background:#f1f3f6;border-bottom-left-radius:5px}
.msg.me .bub{background:var(--accent);color:#fff;border-bottom-right-radius:5px}
.msg.me .bub .lbl{color:#d3ddfb}
.sys{text-align:center;font-size:12.3px;color:var(--muted);margin:12px 0;padding:0 20px}
.bub .lbl{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.bub .qq{font-weight:600;margin-bottom:3px;display:block}
.bub ul{margin:5px 0 3px;padding-left:18px}
.bub li{margin-bottom:7px}
.badges{margin-top:7px;display:flex;gap:5px;flex-wrap:wrap}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;
  background:var(--accent-soft);color:var(--accent);font-weight:600}
.tag.ai{background:#fff;color:var(--ai);border:1px solid #ddd0fb}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.low{background:#fff1f2;color:#9f1239}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.done .bub{outline:2px solid #bbf7d0}
.gone .bub{opacity:.42}

/* ---------- composer ---------- */
.comp{border-top:1px solid var(--line);padding:11px 13px;background:#fcfcfd}
.comp .lineup{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.chip{font-size:12.5px;border-radius:999px;padding:5px 11px;border:1px solid var(--line);
  background:#fff;cursor:pointer;user-select:none}
.chip.on{background:var(--accent-soft);border-color:#b9cbfa;color:var(--accent);font-weight:600}
.comp textarea{width:100%;font:inherit;padding:9px 11px;border:1px solid var(--line);
  border-radius:11px;resize:vertical;min-height:46px;background:#fff;color:var(--ink)}
.comp input[type=text]{width:100%;font:inherit;padding:8px 11px;border:1px solid var(--line);
  border-radius:11px;margin-top:6px;background:#fff}
.comp .send{display:flex;justify-content:space-between;align-items:center;gap:9px;margin-top:8px;flex-wrap:wrap}
.save{font-size:12px;color:var(--ok);font-weight:600}
select{font:inherit;padding:5px 9px;border:1px solid var(--line);border-radius:999px;background:#fff}
.log{font-family:var(--mono);font-size:12px;background:#101318;color:#d6dae1;
  border-radius:10px;padding:11px;max-height:420px;overflow:auto;white-space:pre-wrap}
.log .t{color:#7f8894}
.foot{display:flex;justify-content:space-between;gap:9px;flex-wrap:wrap;
  border-top:1px solid var(--line);padding-top:11px;margin-top:11px}
.snipmini{border-left:3px solid var(--accent);padding:2px 0 2px 9px;margin:5px 0;font-size:13.3px}
.snipmini.unclear{border-left-color:var(--warn)}
.snipmini b{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.snipmini.pick{cursor:pointer;border-radius:8px;padding:6px 9px;margin:7px 0}
.snipmini.pick:hover{background:var(--accent-soft)}
</style>
</head>
<body>
<div class="wrap">

<div class="card">
  <h1>AI Notes — Micro-Prototype</h1>
  <p class="sub">Track 1 · Day 18 · Case B · AI Notes · bốn option A / B / C / D</p>
</div>

<div class="banner" id="facilitator">
  <b>Bảng của facilitator — che phần này khi tester ngồi vào.</b>
  <div id="facilNote" style="margin-top:6px"></div>
</div>

<div class="switcher" id="switcher"></div>

<div class="row">
  <div class="col" style="flex:1 1 580px">
    <div class="chat">
      <div class="chead" id="chead"></div>
      <div class="thread" id="thread"></div>
      <div class="comp" id="comp"></div>
    </div>
  </div>
  <div class="col" style="flex:0 1 330px">
    <div class="card">
      <h2>Nhật ký hành vi tester</h2>
      <p class="sub" style="margin-bottom:9px">Ghi tester <b>đã làm gì</b>, không ghi tester nghĩ gì.</p>
      <div class="log" id="log"></div>
      <div class="foot">
        <button class="mini" onclick="copyLog()">Copy nhật ký</button>
        <button class="mini" onclick="resetAll()">Reset ngữ cảnh</button>
      </div>
    </div>
  </div>
</div>

</div>
<script>
/* =========================================================================
   Content fixture + canned AI output. Viết sẵn, không gọi model thật.
   Mục 10 của đề cho phép tạo content fixture và canned AI output.
   ========================================================================= */
var SNIPPETS = [
  {id:"s1", kind:"Highlight · Slide 3", unclear:false,
   text:"Problem Hypothesis: Khi [situation], [user] gặp khó khăn [job] vì [barrier], dẫn đến [consequence]."},
  {id:"s2", kind:"Ghi chú ngắn · Slide 7", unclear:false,
   text:"Ba phản xạ: Deflect (gạt đi), Anchor (neo lại), Dig (đào sâu) khi gặp lời khen hoặc đòi hỏi tính năng."},
  {id:"s3", kind:"Ảnh chụp + Chưa hiểu · Slide 11", unclear:true,
   text:"Phân biệt Pain (khó khăn lúc làm job) và Consequence (hậu quả nếu không giải quyết)."}
];
function snipById(id){ return SNIPPETS.filter(function(s){ return s.id===id })[0] }
function shortKind(k){ return k.split(" · ")[1] }

var FRAMES = [
  {id:"f1", title:"Tóm tắt", hint:"Tóm ý chính của bài bằng lời của bạn."},
  {id:"f2", title:"Giải thích", hint:"Giải thích lại chỗ bạn đánh dấu chưa hiểu."},
  {id:"f3", title:"Quiz", hint:"Một câu hỏi để tự kiểm tra, kèm đáp án."}
];

var B_CARDS = [
  {id:"b1", mode:"Giải thích", src:"Ảnh chụp + Chưa hiểu · Slide 11",
   q:"Pain khác Consequence ở chỗ nào?",
   a:"Pain là chỗ vướng ngay lúc người dùng đang làm việc. Consequence là cái giá phải trả sau đó nếu chỗ vướng không được gỡ."},
  {id:"b2", mode:"Giải thích", src:"Highlight · Slide 3",
   q:"Vì sao Problem Hypothesis phải có đủ bốn phần?",
   a:"Thiếu situation thì không kiểm chứng được. Thiếu consequence thì không biết pain có đáng giải quyết không."},
  {id:"b3", mode:"Tự kiểm tra", src:"Ghi chú ngắn · Slide 7",
   q:"Người được phỏng vấn đòi thẳng một tính năng thì dùng phản xạ nào?",
   a:"Anchor rồi Dig — neo về lần gần nhất họ gặp chuyện đó, rồi đào hành vi đã xảy ra. Không bàn tính năng."},
  {id:"b4", mode:"Tự kiểm tra", low:true, src:"Ảnh chụp + Chưa hiểu · Slide 11",
   q:"Cho một ví dụ Pain và Consequence đi kèm nó.",
   a:"Pain: đọc lại note mà không nối được thành hệ thống. Consequence: mất thêm một buổi tối để làm lại từ đầu."}
];

var C_GOALS = {
  deep:{label:"Hiểu sâu", core:[
    {t:"Problem Hypothesis phải có đủ bốn phần: situation, job, barrier, consequence.", src:"Highlight · Slide 3"},
    {t:"Pain nằm ở lúc làm việc; Consequence nằm ở sau đó.", src:"Ảnh chụp + Chưa hiểu · Slide 11"},
    {t:"Ba phản xạ Deflect / Anchor / Dig dùng khi người được phỏng vấn khen hoặc đòi tính năng.", src:"Ghi chú ngắn · Slide 7", low:true}]},
  pass:{label:"Đủ qua bài", core:[
    {t:"Nhớ đủ bốn phần của Problem Hypothesis.", src:"Highlight · Slide 3"},
    {t:"Phân biệt được Pain và Consequence.", src:"Ảnh chụp + Chưa hiểu · Slide 11"},
    {t:"Thuộc tên ba phản xạ.", src:"Ghi chú ngắn · Slide 7", low:true}]},
  fast:{label:"Ôn nhanh 5 phút", core:[
    {t:"Bốn phần: situation, job, barrier, consequence.", src:"Highlight · Slide 3"},
    {t:"Pain = lúc làm. Consequence = sau đó.", src:"Ảnh chụp + Chưa hiểu · Slide 11"},
    {t:"Deflect, Anchor, Dig.", src:"Ghi chú ngắn · Slide 7", low:true}]}
};
var C_EXPLAIN = {src:"Ảnh chụp + Chưa hiểu · Slide 11",
  text:"Chỗ bạn đánh dấu chưa hiểu: Pain là chỗ vướng ngay trong lúc người dùng đang làm việc của họ. Consequence là hậu quả xảy ra sau đó nếu chỗ vướng ấy không được gỡ. Một pain không kèm consequence thì thường chỉ là bất tiện."};
var C_QUIZ = [
  {src:"Highlight · Slide 3", q:"Problem Hypothesis thiếu consequence thì hỏng ở đâu?",
   a:"Không biết pain có đáng giải quyết không."},
  {src:"Ghi chú ngắn · Slide 7", low:true, q:"Gặp lời khen thì dùng phản xạ nào?",
   a:"Deflect — gạt lời khen, quay lại chuyện đã xảy ra."},
  {src:"Ảnh chụp + Chưa hiểu · Slide 11", q:"Pain xảy ra ở thời điểm nào?",
   a:"Ngay trong lúc người dùng đang làm job của họ."}
];

/* Option D — canned: một lời giải thích / một mẩu. Không quiz, không digest. */
var D_EXPLAIN = {
  s1:{src:"Highlight · Slide 3", low:false,
    t:"Bốn phần này không phải để cho đủ chữ. Situation để biết lúc nào kiểm chứng được. Job là việc user đang làm. Barrier là chỗ vướng. Consequence cho biết pain có đáng giải quyết không. Thiếu consequence thì chỉ còn một bất tiện, chưa thành pain.",
    easy:"Nhớ vậy: situation = lúc nào, job = đang làm gì, barrier = vướng gì, consequence = nếu không gỡ thì sao. Thiếu cái cuối là không biết việc đó có đáng làm không."},
  s2:{src:"Ghi chú ngắn · Slide 7", low:true,
    t:"Ba phản xạ dùng khi người được phỏng vấn khen sản phẩm hoặc đòi một tính năng. Deflect: gạt lời khen, quay lại chuyện đã xảy ra. Anchor: neo vào lần gần nhất. Dig: đào hành vi cụ thể. Ghi chú gốc chỉ có tên ba phản xạ, chưa có ví dụ — phần còn lại mình suy ra.",
    easy:"Khen thì gạt (Deflect). Đòi tính năng thì hỏi lần gần nhất họ gặp chuyện đó (Anchor), rồi hỏi họ đã làm gì (Dig). Không bàn tính năng."},
  s3:{src:"Ảnh chụp + Chưa hiểu · Slide 11", low:false,
    t:"Pain là chỗ vướng ngay trong lúc người dùng đang làm việc. Consequence là cái giá phải trả sau đó nếu chỗ vướng không được gỡ. Một pain không kèm consequence thường chỉ là bất tiện — chưa đủ để quyết định có nên giải quyết.",
    easy:"Pain = đang làm thì vướng. Consequence = sau đó phải trả giá. Thiếu vế sau thì chưa chắc đáng sửa."}
};

var OPTIONS = {
  A:{name:"A — User tự làm", owner:"Lê Quang Huy — 2A202601821", ai:"Không hành động",
     head:"Sổ ghi chú của bạn", headSt:"Chỉ xếp ghi chú và tự lưu · không soạn nội dung",
     avatar:"app", init:"Sổ",
     facil:"Kiểm tra: khi không có bong bóng AI nào, tester có tự gõ không, gõ loại thẻ nào trước, hay ngồi chờ máy nói."},
  B:{name:"B — Cùng làm", owner:"Đàm Việt Cường — 2A202601566", ai:"Ask / Propose",
     head:"Trợ lý ôn tập", headSt:"Đề xuất bản thảo · bạn duyệt từng thẻ",
     avatar:"ai", init:"AI",
     facil:"Kiểm tra: tester duyệt thẳng hay sửa; có loại thẻ nào không; có để ý tag “AI không chắc” không."},
  C:{name:"C — AI làm sẵn", owner:"Trần Đức Bảo — 2A202601472", ai:"Act",
     head:"Trợ lý ôn tập", headSt:"Đã soạn xong bản ôn tập trước khi bạn hỏi",
     avatar:"ai", init:"AI",
     facil:"Kiểm tra: tester dùng luôn, đổi mục tiêu, hay bấm rollback về ghi chú thô."},
  D:{name:"D — Chỉ đúng chỗ", owner:"Hoàng Minh Quân — 2A202601574", ai:"Ask on demand",
     head:"Trợ lý đúng chỗ", headSt:"Im cho đến khi bạn chỉ một mẩu · không soạn bộ ôn",
     avatar:"ai", init:"AI",
     facil:"Kiểm tra: tester có tự chỉ vào Slide 11 (chưa hiểu) không, có xin dễ hơn không, hay ngồi chờ máy làm cả gói."}
};

var opt="A", log=[], state={};

function ts(){ var d=new Date(); return d.toTimeString().slice(0,8) }
function rec(ev){ log.push({t:ts(),opt:opt,ev:ev}); draw("log") }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c] }) }
function snipList(){ return SNIPPETS.map(function(s){
  return '<div class="snipmini '+(s.unclear?"unclear":"")+'"><b>'+esc(s.kind)+"</b>"+esc(s.text)+"</div>" }).join("") }

function fresh(){
  var s={ msgs:[], savedAt:null, goal:"deep", rolledBack:false, saved:false,
    pick:null, easy:false,
    draft:{frame:0, srcs:[], text:"", answer:""},
    cards:B_CARDS.map(function(c){
      return {id:c.id,mode:c.mode,src:c.src,low:c.low,q:c.q,a:c.a,status:"pending",edited:false} }) };
  if(opt==="A"){
    s.msgs.push({k:"app", lbl:"Sổ ghi chú", t:
      "Mình đã gom lại ba mẩu bạn lưu trong buổi học, xếp theo slide:"+snipList()+
      "<br>Mình <b>không soạn nội dung</b> — phần viết là của bạn. Mình chỉ giữ chỗ và tự lưu."});
    s.msgs.push({k:"sys", t:"Soạn thẻ ở khung dưới. Mỗi thẻ bạn gửi sẽ nằm lại trong sổ này."});
  }
  if(opt==="B"){
    s.msgs.push({k:"ai", lbl:"Trợ lý", t:
      "Mình đọc ba mẩu ghi chú bạn lưu và soạn thử vài thẻ ôn tập. Mỗi thẻ mình ghi rõ lấy từ mẩu nào để bạn đối chiếu.<br><br><b>Bạn duyệt giúp mình từng thẻ nhé</b> — giữ, sửa, đổi cái khác, hay bỏ đều được."});
    B_CARDS.forEach(function(c){ s.msgs.push({k:"card", id:c.id}) });
  }
  if(opt==="C"){ s.msgs.push({k:"digest"}); }
  if(opt==="D"){
    s.msgs.push({k:"ai", lbl:"Trợ lý", t:
      "Mình thấy đúng ba mẩu bạn lưu. Mình <b>không soạn bộ ôn</b> và <b>không làm quiz</b>. Mình chỉ giải thích đúng một mẩu — và chỉ khi bạn chỉ vào.<br><br>Mình im cho đến lúc đó."});
    s.msgs.push({k:"picks"});
    s.msgs.push({k:"sys", t:"Chọn một mẩu. Mình không làm gì trước khi bạn chọn."});
  }
  return s;
}
function st(){ if(!state[opt]) state[opt]=fresh(); return state[opt] }
function say(k,obj){ st().msgs.push(Object.assign({k:k},obj)) }

/* ------------------------------ render ------------------------------ */
function draw(what){
  if(!what||what==="switcher"){
    document.getElementById("switcher").innerHTML = Object.keys(OPTIONS).map(function(k){
      return '<button aria-pressed="'+(k===opt)+'" onclick="setOpt(\''+k+'\')">'+esc(OPTIONS[k].name)+"</button>"
    }).join("");
    var o=OPTIONS[opt];
    document.getElementById("facilNote").innerHTML =
      "<b>"+esc(o.name)+"</b> · phụ trách: "+esc(o.owner)+
      ' · vai trò AI: <span class="tag ai">'+esc(o.ai)+"</span><br>"+esc(o.facil);
    document.getElementById("chead").innerHTML =
      '<div class="avatar '+o.avatar+'">'+esc(o.init)+"</div><div>"+
      '<div class="who">'+esc(o.head)+'</div><div class="st">'+esc(o.headSt)+"</div></div>";
  }
  if(!what||what==="thread"){ drawThread(); drawComp() }
  if(!what||what==="log"){
    var el=document.getElementById("log");
    el.innerHTML = log.length ? log.map(function(l){
      return '<span class="t">'+l.t+"  ["+l.opt+"]</span>  "+esc(l.ev) }).join("\n")
      : '<span class="t">chưa có thao tác nào</span>';
    el.scrollTop = el.scrollHeight;
  }
}

function badge(src,low,extra){
  return '<div class="badges"><span class="tag ai">Dựa vào '+esc(src)+"</span>"+
    (low?'<span class="tag low">AI không chắc — mẩu gốc quá ngắn, nên đối chiếu lại</span>':"")+
    (extra||"")+"</div>";
}

function drawThread(){
  var s=st(), out="";
  s.msgs.forEach(function(m){
    if(m.k==="sys"){ out+='<div class="sys">'+m.t+"</div>"; return }
    if(m.k==="card"){ out+=cardMsg(s,m.id); return }
    if(m.k==="digest"){ out+=digestMsg(s); return }
    if(m.k==="picks"){ out+=picksMsg(); return }
    if(m.k==="explain"){ out+=explainMsg(m); return }
    if(m.k==="usercard"){ out+=userCardMsg(m); return }
    var cls = m.k==="me" ? "me" : m.k;
    out+='<div class="msg '+cls+'">'+
      (m.k==="me"?"":'<div class="avatar '+(m.k==="ai"?"ai":"app")+'">'+(m.k==="ai"?"AI":"Sổ")+"</div>")+
      '<div class="bub">'+(m.lbl?'<div class="lbl">'+esc(m.lbl)+"</div>":"")+m.t+"</div></div>";
  });
  var el=document.getElementById("thread");
  el.innerHTML=out; el.scrollTop=el.scrollHeight;
}

function cardMsg(s,id){
  var c=s.cards.filter(function(x){ return x.id===id })[0];
  var extra = (c.edited?'<span class="tag warn">bạn đã sửa</span>':"")+
              (c.status==="accepted"?'<span class="tag ok">bạn đã giữ</span>':"")+
              (c.status==="rejected"?'<span class="tag warn">bạn đã bỏ</span>':"");
  return '<div class="msg ai '+(c.status==="accepted"?"done":"")+" "+(c.status==="rejected"?"gone":"")+'">'+
    '<div class="avatar ai">AI</div><div class="bub">'+
    '<div class="lbl">Thẻ '+esc(c.mode.toLowerCase())+"</div>"+
    '<div class="qq">'+esc(c.q)+"</div>"+esc(c.a)+
    badge(c.src,c.low,extra)+
    (c.status==="pending"
      ? '<div class="acts"><button class="primary mini" onclick="cardAct(\''+c.id+'\',\'accept\')">Giữ thẻ này</button>'+
        '<button class="mini" onclick="cardAct(\''+c.id+'\',\'edit\')">Sửa lại</button>'+
        '<button class="mini" onclick="cardAct(\''+c.id+'\',\'regen\')">Đổi thẻ khác</button>'+
        '<button class="mini" onclick="cardAct(\''+c.id+'\',\'reject\')">Bỏ thẻ này</button></div>'
      : '<div class="acts"><button class="mini" onclick="cardAct(\''+c.id+'\',\'undo\')">Hoàn tác</button></div>')+
    "</div></div>";
}

function digestMsg(s){
  if(s.rolledBack){
    return '<div class="msg app"><div class="avatar app">Sổ</div><div class="bub">'+
      '<div class="lbl">Đã quay về ghi chú thô</div>'+
      "Mình đã gỡ bản ôn tập vừa soạn. Còn lại đúng ba mẩu bạn lưu:"+snipList()+"</div></div>";
  }
  var g=C_GOALS[s.goal];
  return '<div class="msg ai"><div class="avatar ai">AI</div><div class="bub">'+
    '<div class="lbl">Bản ôn tập · mục tiêu "'+esc(g.label)+'"</div>'+
    "Chào bạn, mình soạn sẵn bản ôn tập từ ghi chú buổi vừa rồi rồi nhé.<br><br><b>Ba ý cốt lõi</b><ul>"+
    g.core.map(function(c){
      return "<li>"+esc(c.t)+'<div class="badges"><span class="tag ai">'+esc(shortKind(c.src))+"</span>"+
        (c.low?'<span class="tag low">AI không chắc</span>':"")+"</div></li>" }).join("")+"</ul>"+
    "<b>Chỗ bạn đánh dấu chưa hiểu</b><br>"+esc(C_EXPLAIN.text)+
    '<div class="badges"><span class="tag ai">'+esc(shortKind(C_EXPLAIN.src))+"</span></div><br>"+
    "<b>Ba câu tự kiểm tra</b><ul>"+
    C_QUIZ.map(function(c){
      return '<li><span class="qq">'+esc(c.q)+"</span>"+esc(c.a)+
        '<div class="badges"><span class="tag ai">'+esc(shortKind(c.src))+"</span>"+
        (c.low?'<span class="tag low">AI không chắc</span>':"")+"</div></li>" }).join("")+"</ul>"+
    "</div></div>";
}

function picksMsg(){
  return '<div class="msg app"><div class="avatar app">Sổ</div><div class="bub">'+
    '<div class="lbl">Ba mẩu bạn đã lưu</div>'+
    "Bấm một mẩu — mình chỉ giải thích đúng chỗ đó."+
    SNIPPETS.map(function(s){
      return '<div class="snipmini pick '+(s.unclear?"unclear":"")+'" onclick="askD(\''+s.id+'\')">'+
        "<b>"+esc(s.kind)+(s.unclear?" · chưa hiểu":"")+"</b>"+esc(s.text)+"</div>" }).join("")+
    "</div></div>";
}
function explainMsg(m){
  var sn=snipById(m.id), d=D_EXPLAIN[m.id];
  return '<div class="msg ai"><div class="avatar ai">AI</div><div class="bub">'+
    '<div class="lbl">'+(m.easy?"Giải thích dễ hơn":"Giải thích một mẩu")+"</div>"+
    '<div class="snipmini '+(sn.unclear?"unclear":"")+'"><b>Mẩu gốc · '+esc(sn.kind)+"</b>"+esc(sn.text)+"</div>"+
    esc(m.easy?d.easy:d.t)+
    badge(d.src,d.low,m.easy?'<span class="tag warn">bạn xin bản dễ hơn</span>':"")+
    "</div></div>";
}

function userCardMsg(m){
  return '<div class="msg me"><div class="bub">'+
    '<div class="lbl">'+esc(FRAMES[m.frame].title)+"</div>"+
    '<div class="qq">'+esc(m.text)+"</div>"+
    (m.answer?esc(m.answer):"")+
    (m.srcs.length?'<div class="badges">'+m.srcs.map(function(id){
      return '<span class="tag">'+esc(shortKind(snipById(id).kind))+"</span>" }).join("")+"</div>":"")+
    "</div></div>";
}

/* ----------------------------- composer ----------------------------- */
function drawComp(){
  var s=st(), el=document.getElementById("comp");
  if(opt==="A") el.innerHTML=compA(s);
  else if(opt==="B") el.innerHTML=compB(s);
  else if(opt==="C") el.innerHTML=compC(s);
  else el.innerHTML=compD(s);
}

function compA(s){
  var d=s.draft;
  return '<div class="lineup">'+
    FRAMES.map(function(f,i){
      return '<span class="chip '+(d.frame===i?"on":"")+'" onclick="setFrame('+i+')">'+esc(f.title)+"</span>" }).join("")+
    '<span style="color:var(--muted);font-size:12.5px;margin-left:4px">'+esc(FRAMES[d.frame].hint)+"</span></div>"+
    '<div class="lineup"><span style="font-size:12.5px;color:var(--muted)">Gắn mẩu:</span>'+
    SNIPPETS.map(function(sn){
      return '<span class="chip '+(d.srcs.indexOf(sn.id)>-1?"on":"")+'" onclick="toggleSrc(\''+sn.id+'\')">'+
        esc(shortKind(sn.kind))+"</span>" }).join("")+"</div>"+
    '<textarea id="ta" placeholder="bạn tự gõ, sổ không gợi ý gì" oninput="typing(\'text\',this.value)">'+esc(d.text)+"</textarea>"+
    (d.frame===2?'<input type="text" id="ans" placeholder="đáp án cho câu hỏi này" value="'+esc(d.answer)+'" oninput="typing(\'answer\',this.value)">':"")+
    '<div class="send"><span class="sub">'+
      (s.savedAt?'<span class="save">tự lưu lúc '+s.savedAt+"</span>":"chưa có gì để lưu")+"</span>"+
      '<button class="primary" '+(d.text.trim()?"":"disabled")+' onclick="sendA()">Gửi vào sổ</button></div>';
}

function compB(s){
  var open=s.cards.filter(function(c){ return c.status==="pending" }).length;
  var kept=s.cards.filter(function(c){ return c.status==="accepted" }).length;
  return '<div class="send"><span class="sub">'+
    (open? "Còn "+open+" thẻ chưa duyệt" : "Đã duyệt hết · giữ "+kept+" thẻ")+"</span>"+
    '<button class="primary" '+(open?"disabled":"")+' onclick="finishB()">Chốt bộ ôn tập</button></div>';
}

function compC(s){
  if(s.rolledBack){
    return '<div class="send"><span class="sub">Bạn đang ở ghi chú gốc</span>'+
      '<button class="primary" onclick="undoRollback()">Soạn lại giúp mình</button></div>';
  }
  return '<div class="lineup"><span style="font-size:12.5px;color:var(--muted)">Đổi mục tiêu:</span>'+
    Object.keys(C_GOALS).map(function(k){
      return '<span class="chip '+(s.goal===k?"on":"")+'" onclick="setGoal(\''+k+'\')">'+esc(C_GOALS[k].label)+"</span>" }).join("")+"</div>"+
    '<div class="send"><button class="mini" onclick="rollback()">Bỏ bản này, cho mình ghi chú thô</button>'+
    '<button class="primary" onclick="startC()">Bắt đầu ôn</button></div>';
}

function compD(s){
  var open=s.pick ? snipById(s.pick) : null;
  return '<div class="lineup"><span style="font-size:12.5px;color:var(--muted)">Chọn một mẩu:</span>'+
    SNIPPETS.map(function(sn){
      return '<span class="chip '+(s.pick===sn.id?"on":"")+'" onclick="askD(\''+sn.id+'\')">'+
        esc(shortKind(sn.kind))+(sn.unclear?" · chưa hiểu":"")+"</span>" }).join("")+"</div>"+
    '<div class="send"><span class="sub">'+
      (open ? "Đang giải thích "+esc(shortKind(open.kind)) : "Mình chưa soạn gì — bạn chọn một mẩu")+"</span>"+
      (open
        ? '<span><button class="mini" onclick="easierD()">Giải thích dễ hơn</button> '+
          '<button class="mini" onclick="closeD()">Đóng, về ba mẩu</button></span>'
        : "")+"</div>";
}

/* ------------------------------ actions ------------------------------ */
function setOpt(k){ opt=k; rec("chuyển sang option "+k); draw() }

function setFrame(i){ var d=st().draft; d.frame=i; rec("chọn loại thẻ: "+FRAMES[i].title); draw("thread") }
function toggleSrc(id){
  var d=st().draft, i=d.srcs.indexOf(id);
  if(i>-1){ d.srcs.splice(i,1); rec("bỏ gắn "+snipById(id).kind) }
  else { d.srcs.push(id); rec("gắn "+snipById(id).kind+" vào thẻ đang soạn") }
  autosave(); draw("thread");
}
function typing(field,v){
  var d=st().draft, first=!d[field];
  d[field]=v; autosave();
  if(first&&v) rec("bắt đầu gõ "+(field==="answer"?"đáp án":"nội dung")+" cho thẻ "+FRAMES[d.frame].title.toLowerCase());
  var b=document.querySelector(".send button.primary");
  if(b&&opt==="A") b.disabled=!d.text.trim();
}
function autosave(){ var s=st(); s.savedAt=ts();
  var el=document.querySelector(".save"); if(el) el.textContent="tự lưu lúc "+s.savedAt }
function sendA(){
  var s=st(), d=s.draft;
  say("usercard",{frame:d.frame, srcs:d.srcs.slice(), text:d.text, answer:d.answer});
  rec("gửi thẻ "+FRAMES[d.frame].title.toLowerCase()+" vào sổ — "+d.srcs.length+" mẩu gắn kèm");
  s.draft={frame:d.frame, srcs:[], text:"", answer:""}; s.saved=true; autosave(); draw("thread");
}

function cardAct(id,act){
  var s=st(), c=s.cards.filter(function(x){ return x.id===id })[0];
  if(act==="accept"){ c.status="accepted"; say("me",{t:"Giữ thẻ này."});
    rec("giữ thẻ "+c.mode.toLowerCase()+': "'+c.q.slice(0,32)+'…"') }
  if(act==="reject"){ c.status="rejected"; say("me",{t:"Bỏ thẻ này."});
    rec("bỏ thẻ "+c.mode.toLowerCase()+': "'+c.q.slice(0,32)+'…"') }
  if(act==="undo"){ c.status="pending"; say("me",{t:"Cho mình xem lại thẻ đó."});
    rec("hoàn tác một thẻ "+c.mode.toLowerCase()) }
  if(act==="regen"){ c.q="["+c.q+"] — bản viết lại"; c.edited=true;
    say("me",{t:"Đổi thẻ khác giúp mình."}); rec("bấm đổi thẻ khác, nguồn "+c.src) }
  if(act==="edit"){
    var nq=prompt("Sửa nội dung thẻ:",c.q);
    if(nq!==null&&nq.trim()){ c.q=nq.trim(); c.edited=true; say("me",{t:"Mình sửa lại thẻ này."});
      rec("sửa tay thẻ "+c.mode.toLowerCase()+", nguồn "+c.src) }
  }
  draw("thread");
}
function finishB(){
  var s=st(); s.saved=true;
  var ex=s.cards.filter(function(c){ return c.mode==="Giải thích"&&c.status==="accepted" }).length;
  var qz=s.cards.filter(function(c){ return c.mode==="Tự kiểm tra"&&c.status==="accepted" }).length;
  say("ai",{lbl:"Trợ lý", t:"Chốt rồi nhé. Bộ ôn tập của bạn có <b>"+ex+" thẻ giải thích</b> và <b>"+qz+" thẻ tự kiểm tra</b>. Mọi thẻ đều đi qua tay bạn."});
  rec("chốt — giữ "+ex+" thẻ giải thích, "+qz+" thẻ tự kiểm tra, bỏ "+
      s.cards.filter(function(c){ return c.status==="rejected" }).length+
      ", sửa "+s.cards.filter(function(c){ return c.edited }).length);
  draw("thread");
}

function setGoal(v){
  var s=st(); s.goal=v; say("me",{t:'Đổi sang mục tiêu "'+esc(C_GOALS[v].label)+'".'});
  s.msgs.push({k:"digest"});
  rec('đổi mục tiêu sang "'+C_GOALS[v].label+'"'); draw("thread");
}
function startC(){ var s=st(); s.saved=true; say("me",{t:"Bắt đầu ôn."});
  rec('bắt đầu ôn bản AI soạn sẵn, mục tiêu "'+C_GOALS[s.goal].label+'"'); draw("thread") }
function rollback(){
  var s=st(); s.rolledBack=true; s.saved=false;
  say("me",{t:"Bỏ bản này, cho mình ghi chú thô."}); s.msgs.push({k:"digest"});
  rec("rollback — bỏ bản AI soạn, quay về ghi chú thô"); draw("thread");
}
function undoRollback(){
  var s=st(); s.rolledBack=false; say("me",{t:"Soạn lại giúp mình."}); s.msgs.push({k:"digest"});
  rec("tạo lại bản tóm tắt sau rollback"); draw("thread");
}

function askD(id){
  var s=st(), sn=snipById(id);
  s.pick=id; s.easy=false;
  say("me",{t:"Giải thích giúp mình mẩu này: "+esc(sn.kind)+"."});
  s.msgs.push({k:"explain", id:id, easy:false});
  rec("chọn mẩu "+sn.kind+(sn.unclear?" — chỗ đánh dấu chưa hiểu":""));
  draw("thread");
}
function easierD(){
  var s=st(); if(!s.pick) return;
  s.easy=true;
  say("me",{t:"Giải thích dễ hơn giúp mình."});
  s.msgs.push({k:"explain", id:s.pick, easy:true});
  rec("xin bản giải thích dễ hơn cho "+snipById(s.pick).kind);
  draw("thread");
}
function closeD(){
  var s=st(), sn=s.pick?snipById(s.pick):null;
  s.pick=null; s.easy=false;
  say("me",{t:"Đóng lời giải này, cho mình về ba mẩu."});
  s.msgs.push({k:"picks"});
  rec("đóng lời giải"+(sn?" — "+sn.kind:"")+", quay về ba mẩu thô");
  draw("thread");
}

function resetAll(){ state={}; log=[]; opt="A"; draw() }
function copyLog(){
  var txt=log.map(function(l){ return l.t+"\t["+l.opt+"]\t"+l.ev }).join("\n");
  if(navigator.clipboard) navigator.clipboard.writeText(txt);
}
draw();
</script>
</body>
</html>
